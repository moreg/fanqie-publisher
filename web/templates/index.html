<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄小说自动发布器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const API_BASE = '/api';

        function App() {
            const [currentPage, setCurrentPage] = React.useState('dashboard');
            const [stats, setStats] = React.useState({});

            React.useEffect(() => {
                fetch(`${API_BASE}/logs/stats`)
                    .then(r => r.json())
                    .then(setStats)
                    .catch(() => {});
            }, []);

            return (
                <div className="min-h-screen bg-gray-100">
                    {/* 顶部导航 */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <h1 className="text-2xl font-bold text-gray-800">🍅 番茄小说自动发布器</h1>
                        </div>
                    </div>

                    <div className="flex max-w-7xl mx-auto mt-6 px-4">
                        {/* 侧边栏 */}
                        <div className="w-56 bg-white rounded-lg shadow-sm border border-gray-200 p-4 mr-6">
                            <nav className="space-y-1">
                                {[
                                    { id: 'dashboard', label: '仪表盘', icon: '📊' },
                                    { id: 'accounts', label: '账号管理', icon: '👤' },
                                    { id: 'books', label: '书籍管理', icon: '📚' },
                                    { id: 'tasks', label: '待发布', icon: '📋' },
                                    { id: 'logs', label: '发布日志', icon: '📝' },
                                    { id: 'feishu', label: '飞书配置', icon: '🔔' },
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setCurrentPage(item.id)}
                                        className={`w-full text-left px-4 py-3 rounded-md flex items-center gap-3 text-sm font-medium transition-colors ${
                                            currentPage === item.id
                                                ? 'bg-blue-50 text-blue-600 border border-blue-200'
                                                : 'text-gray-600 hover:bg-gray-50'
                                        }`}
                                    >
                                        <span>{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* 主内容 */}
                        <div className="flex-1">
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                                <h2 className="text-xl font-semibold text-gray-800 mb-6">
                                    {currentPage === 'dashboard' && '📊 仪表盘'}
                                    {currentPage === 'accounts' && '👤 账号管理'}
                                    {currentPage === 'books' && '📚 书籍管理'}
                                    {currentPage === 'tasks' && '📋 待发布任务'}
                                    {currentPage === 'logs' && '📝 发布日志'}
                                    {currentPage === 'feishu' && '🔔 飞书配置'}
                                </h2>

                                {currentPage === 'dashboard' && <Dashboard stats={stats} />}
                                {currentPage === 'accounts' && <Accounts />}
                                {currentPage === 'books' && <Books />}
                                {currentPage === 'tasks' && <Tasks />}
                                {currentPage === 'logs' && <Logs />}
                                {currentPage === 'feishu' && <FeishuConfig />}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ stats }) {
            return (
                <div className="grid grid-cols-4 gap-4">
                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <div className="text-blue-600 text-sm">总章节数</div>
                        <div className="text-2xl font-bold text-blue-700 mt-1">{stats.total_chapters || 0}</div>
                    </div>
                    <div className="bg-green-50 border border-green-200 rounded-lg p-4">
                        <div className="text-green-600 text-sm">已发布</div>
                        <div className="text-2xl font-bold text-green-700 mt-1">{stats.published_chapters || 0}</div>
                    </div>
                    <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-4">
                        <div className="text-emerald-600 text-sm">发布成功</div>
                        <div className="text-2xl font-bold text-emerald-700 mt-1">{stats.successful_publishes || 0}</div>
                    </div>
                    <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div className="text-red-600 text-sm">发布失败</div>
                        <div className="text-2xl font-bold text-red-700 mt-1">{stats.failed_publishes || 0}</div>
                    </div>
                </div>
            );
        }

        function Accounts() {
            const [accounts, setAccounts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showAdd, setShowAdd] = React.useState(false);
            const [editId, setEditId] = React.useState(null);
            const [form, setForm] = React.useState({ name: '', phone: '', cookies: '' });
            const [showCookieHelp, setShowCookieHelp] = React.useState(false);

            const loadAccounts = () => {
                setLoading(true);
                fetch(`${API_BASE}/accounts`)
                    .then(r => r.json())
                    .then(data => setAccounts(Array.isArray(data) ? data : (data.accounts || [])))
                    .catch(() => setAccounts([]))
                    .finally(() => setLoading(false));
            };

            React.useEffect(() => { loadAccounts(); }, []);

            const handleAdd = async () => {
                if (!form.name) return;
                const payload = {
                    name: form.name,
                    phone: form.phone,
                    cookies: form.cookies || null
                };
                await fetch(`${API_BASE}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                setForm({ name: '', phone: '', cookies: '' });
                setShowAdd(false);
                loadAccounts();
            };

            const handleEdit = (acc) => {
                setEditId(acc.id);
                setForm({ name: acc.name, phone: acc.phone || '', cookies: '' });
                setShowAdd(false);
            };

            const handleUpdate = async () => {
                if (!form.name || !editId) return;
                const payload = {
                    name: form.name,
                    phone: form.phone,
                    cookies: form.cookies || null
                };
                await fetch(`${API_BASE}/accounts/${editId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                setForm({ name: '', phone: '', cookies: '' });
                setEditId(null);
                loadAccounts();
            };

            const handleDelete = async (id) => {
                if (!confirm('确定删除这个账号？')) return;
                await fetch(`${API_BASE}/accounts/${id}`, { method: 'DELETE' });
                loadAccounts();
            };

            const handleCancel = () => {
                setEditId(null);
                setForm({ name: '', phone: '', cookies: '' });
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">共 {accounts.length} 个账号</span>
                        <button onClick={() => { setShowAdd(!showAdd); setEditId(null); setForm({ name: '', phone: '', cookies: '' }); }}
                            className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">
                            {showAdd ? '取消' : '+ 添加账号'}
                        </button>
                    </div>

                    {(showAdd || editId) && (
                        <div className="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <div className="grid grid-cols-1 gap-4">
                                <input type="text" placeholder="账号名称 *" value={form.name}
                                    onChange={e => setForm({...form, name: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                <input type="text" placeholder="手机号(可选)" value={form.phone}
                                    onChange={e => setForm({...form, phone: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                <div>
                                    <div className="flex items-center justify-between mb-1">
                                        <label className="text-sm text-gray-600">Cookie (可选)</label>
                                        <button onClick={() => setShowCookieHelp(!showCookieHelp)}
                                            className="text-xs text-blue-600 hover:text-blue-800">
                                            {showCookieHelp ? '收起' : '如何获取?'}
                                        </button>
                                    </div>
                                    <textarea placeholder='[{"name":"cookie_name","value":"cookie_value","domain":".fanqienovel.com",...}]'
                                        value={form.cookies}
                                        onChange={e => setForm({...form, cookies: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm font-mono"
                                        rows="4" />
                                    {showCookieHelp && (
                                        <div className="mt-2 p-2 bg-blue-50 rounded text-xs text-blue-800">
                                            <p><strong>获取Cookie方法:</strong></p>
                                            <p>1. 在Chrome/Edge浏览器登录 fanqienovel.com</p>
                                            <p>2. 按 F12 打开开发者工具</p>
                                            <p>3. 切换到 Application (应用) 标签</p>
                                            <p>4. 左侧选择 Cookies → https://fanqienovel.com</p>
                                            <p>5. 复制所有 cookie 为 JSON 格式</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="flex gap-2 mt-3">
                                <button onClick={editId ? handleUpdate : handleAdd}
                                    className="px-4 py-2 bg-green-600 text-white rounded-md text-sm hover:bg-green-700">
                                    {editId ? '保存修改' : '确认添加'}
                                </button>
                                {(showAdd || editId) && (
                                    <button onClick={handleCancel}
                                        className="px-4 py-2 bg-gray-200 text-gray-700 rounded-md text-sm hover:bg-gray-300">
                                        取消
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                    {accounts.length === 0 && !showAdd && !editId ? (
                        <div className="text-gray-400 text-center py-8">暂无账号，点击上方按钮添加</div>
                    ) : accounts.length > 0 ? (
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-gray-500 border-b">
                                    <th className="pb-2">ID</th>
                                    <th className="pb-2">名称</th>
                                    <th className="pb-2">手机号</th>
                                    <th className="pb-2">Cookie</th>
                                    <th className="pb-2">状态</th>
                                    <th className="pb-2">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                {accounts.map(acc => (
                                    <tr key={acc.id} className="border-b border-gray-100 hover:bg-gray-50">
                                        <td className="py-3">{acc.id}</td>
                                        <td className="py-3">{acc.name}</td>
                                        <td className="py-3">{acc.phone || '-'}</td>
                                        <td className="py-3">
                                            {acc.has_cookies ? (
                                                <span className="px-2 py-1 rounded text-xs bg-green-100 text-green-700">已配置</span>
                                            ) : (
                                                <span className="px-2 py-1 rounded text-xs bg-gray-100 text-gray-500">未配置</span>
                                            )}
                                        </td>
                                        <td className="py-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                acc.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'
                                            }`}>
                                                {acc.status === 'active' ? '已登录' : '未登录'}
                                            </span>
                                        </td>
                                        <td className="py-3">
                                            <button onClick={() => handleEdit(acc)}
                                                className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded hover:bg-blue-200 mr-1">
                                                编辑
                                            </button>
                                            <button onClick={() => handleDelete(acc.id)}
                                                className="px-2 py-1 text-xs bg-red-100 text-red-700 rounded hover:bg-red-200">
                                                删除
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    ) : null}
                </div>
            );
        }

        function Books() {
            const [books, setBooks] = React.useState([]);
            const [accounts, setAccounts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showAdd, setShowAdd] = React.useState(false);
            const [form, setForm] = React.useState({ account_id: '', book_name: '', fanqie_book_id: '', local_folder: '' });

            const loadData = () => {
                setLoading(true);
                Promise.all([
                    fetch(`${API_BASE}/books`).then(r => r.json()),
                    fetch(`${API_BASE}/accounts`).then(r => r.json())
                ]).then(([booksData, accountsData]) => {
                    setBooks(Array.isArray(booksData) ? booksData : (booksData.books || []));
                    setAccounts(Array.isArray(accountsData) ? accountsData : (accountsData.accounts || []));
                }).catch(() => {
                    setBooks([]);
                    setAccounts([]);
                }).finally(() => setLoading(false));
            };

            React.useEffect(() => { loadData(); }, []);

            const handleAdd = async () => {
                if (!form.account_id || !form.book_name) return;
                await fetch(`${API_BASE}/books`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(form)
                });
                setForm({ account_id: '', book_name: '', fanqie_book_id: '', local_folder: '' });
                setShowAdd(false);
                loadData();
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">共 {books.length} 本书籍</span>
                        <button onClick={() => setShowAdd(!showAdd)}
                            className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">
                            {showAdd ? '取消' : '+ 添加书籍'}
                        </button>
                    </div>

                    {showAdd && (
                        <div className="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <div className="grid grid-cols-2 gap-4">
                                <select value={form.account_id}
                                    onChange={e => setForm({...form, account_id: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm">
                                    <option value="">选择账号</option>
                                    {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                </select>
                                <input type="text" placeholder="书籍名称" value={form.book_name}
                                    onChange={e => setForm({...form, book_name: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                <input type="text" placeholder="番茄书籍ID(可选)" value={form.fanqie_book_id}
                                    onChange={e => setForm({...form, fanqie_book_id: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                <input type="text" placeholder="本地文件夹路径" value={form.local_folder}
                                    onChange={e => setForm({...form, local_folder: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                            </div>
                            <button onClick={handleAdd}
                                className="mt-3 px-4 py-2 bg-green-600 text-white rounded-md text-sm hover:bg-green-700">
                                确认添加
                            </button>
                        </div>
                    )}
                    {books.length === 0 ? (
                        <div className="text-gray-400 text-center py-8">暂无书籍</div>
                    ) : (
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-gray-500 border-b">
                                    <th className="pb-2">ID</th>
                                    <th className="pb-2">书名</th>
                                    <th className="pb-2">账号</th>
                                    <th className="pb-2">番茄ID</th>
                                    <th className="pb-2">状态</th>
                                </tr>
                            </thead>
                            <tbody>
                                {books.map(book => (
                                    <tr key={book.id} className="border-b border-gray-100">
                                        <td className="py-3">{book.id}</td>
                                        <td className="py-3">{book.book_name}</td>
                                        <td className="py-3">{book.account_name}</td>
                                        <td className="py-3 text-gray-500">{book.fanqie_book_id || '-'}</td>
                                        <td className="py-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                book.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'
                                            }`}>
                                                {book.status === 'active' ? '正常' : '停用'}
                                            </span>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        }

        function Tasks() {
            const [tasks, setTasks] = React.useState([]);
            const [books, setBooks] = React.useState([]);
            const [chapters, setChapters] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showAdd, setShowAdd] = React.useState(false);
            const [form, setForm] = React.useState({ book_id: '', chapter_id: '', scheduled_time: '' });

            const loadTasks = () => {
                setLoading(true);
                fetch(`${API_BASE}/tasks`)
                    .then(r => r.json())
                    .then(data => setTasks(Array.isArray(data) ? data : (data.tasks || [])))
                    .catch(() => setTasks([]))
                    .finally(() => setLoading(false));
            };

            const loadBooks = () => {
                fetch(`${API_BASE}/books`).then(r => r.json())
                    .then(data => setBooks(Array.isArray(data) ? data : (data.books || [])));
            };

            const loadChapters = (bookId) => {
                fetch(`${API_BASE}/books/${bookId}/chapters`).then(r => r.json())
                    .then(data => setChapters(Array.isArray(data) ? data : []));
            };

            React.useEffect(() => { loadTasks(); loadBooks(); }, []);

            const handleBookChange = (bookId) => {
                setForm({...form, book_id: bookId, chapter_id: ''});
                if (bookId) loadChapters(bookId);
            };

            const handleAdd = async () => {
                if (!form.chapter_id) return;
                const scheduled = form.scheduled_time || new Date().toISOString();
                await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chapter_id: parseInt(form.chapter_id), scheduled_time: scheduled })
                });
                setForm({ book_id: '', chapter_id: '', scheduled_time: '' });
                setShowAdd(false);
                setChapters([]);
                loadTasks();
            };

            const handleDelete = async (taskId) => {
                await fetch(`${API_BASE}/tasks/${taskId}`, { method: 'DELETE' });
                loadTasks();
            };

            const handleCancel = async (taskId) => {
                await fetch(`${API_BASE}/tasks/${taskId}/cancel`, { method: 'POST' });
                loadTasks();
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">共 {tasks.length} 个待发布任务</span>
                        <button onClick={() => setShowAdd(!showAdd)}
                            className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">
                            {showAdd ? '取消' : '+ 添加任务'}
                        </button>
                    </div>

                    {showAdd && (
                        <div className="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <div className="grid grid-cols-3 gap-4">
                                <select value={form.book_id}
                                    onChange={e => handleBookChange(e.target.value)}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm">
                                    <option value="">选择书籍</option>
                                    {books.map(b => <option key={b.id} value={b.id}>{b.book_name}</option>)}
                                </select>
                                <select value={form.chapter_id}
                                    onChange={e => setForm({...form, chapter_id: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm">
                                    <option value="">选择章节</option>
                                    {chapters.map(c => <option key={c.id} value={c.id}>第{c.chapter_number}章 {c.chapter_title}</option>)}
                                </select>
                                <input type="datetime-local" value={form.scheduled_time}
                                    onChange={e => setForm({...form, scheduled_time: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                            </div>
                            <button onClick={handleAdd}
                                className="mt-3 px-4 py-2 bg-green-600 text-white rounded-md text-sm hover:bg-green-700">
                                确认添加
                            </button>
                        </div>
                    )}
                    {tasks.length === 0 ? (
                        <div className="text-gray-400 text-center py-8">暂无待发布任务</div>
                    ) : (
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-gray-500 border-b">
                                    <th className="pb-2">ID</th>
                                    <th className="pb-2">章节</th>
                                    <th className="pb-2">计划时间</th>
                                    <th className="pb-2">状态</th>
                                    <th className="pb-2">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                {tasks.map(task => (
                                    <tr key={task.id} className="border-b border-gray-100 hover:bg-gray-50">
                                        <td className="py-3">{task.id}</td>
                                        <td className="py-3">{task.chapter_title || `章节${task.chapter_id}`}</td>
                                        <td className="py-3 text-gray-500">{task.scheduled_time ? new Date(task.scheduled_time).toLocaleString() : '-'}</td>
                                        <td className="py-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                task.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                                                task.status === 'publishing' ? 'bg-blue-100 text-blue-700' :
                                                task.status === 'published' ? 'bg-green-100 text-green-700' :
                                                'bg-gray-100 text-gray-600'
                                            }`}>
                                                {task.status === 'pending' ? '待发布' :
                                                 task.status === 'publishing' ? '发布中' :
                                                 task.status === 'published' ? '已发布' : task.status}
                                            </span>
                                        </td>
                                        <td className="py-3">
                                            {task.status === 'pending' && (
                                                <>
                                                    <button onClick={() => handleCancel(task.id)}
                                                        className="px-2 py-1 text-xs bg-orange-100 text-orange-700 rounded hover:bg-orange-200 mr-1">
                                                        取消
                                                    </button>
                                                    <button onClick={() => handleDelete(task.id)}
                                                        className="px-2 py-1 text-xs bg-red-100 text-red-700 rounded hover:bg-red-200">
                                                        删除
                                                    </button>
                                                </>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        }

        function Logs() {
            const [logs, setLogs] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                fetch(`${API_BASE}/logs?limit=50`)
                    .then(r => r.json())
                    .then(data => setLogs(Array.isArray(data) ? data : (data.logs || [])))
                    .catch(() => setLogs([]))
                    .finally(() => setLoading(false));
            }, []);

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">最近 {logs.length} 条日志</span>
                    </div>
                    {logs.length === 0 ? (
                        <div className="text-gray-400 text-center py-8">暂无日志</div>
                    ) : (
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-gray-500 border-b">
                                    <th className="pb-2">时间</th>
                                    <th className="pb-2">章节</th>
                                    <th className="pb-2">操作</th>
                                    <th className="pb-2">状态</th>
                                    <th className="pb-2">消息</th>
                                </tr>
                            </thead>
                            <tbody>
                                {logs.map(log => (
                                    <tr key={log.id} className="border-b border-gray-100">
                                        <td className="py-3 text-gray-500 text-xs">{log.created_at}</td>
                                        <td className="py-3">{log.chapter_title}</td>
                                        <td className="py-3">{log.action}</td>
                                        <td className="py-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                log.status === 'success' ? 'bg-green-100 text-green-700' :
                                                log.status === 'failed' ? 'bg-red-100 text-red-700' :
                                                'bg-gray-100 text-gray-600'
                                            }`}>
                                                {log.status === 'success' ? '成功' : log.status === 'failed' ? '失败' : log.status}
                                            </span>
                                        </td>
                                        <td className="py-3 text-gray-500 text-xs">{log.message || '-'}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    )}
                </div>
            );
        }

        function FeishuConfig() {
            const [config, setConfig] = React.useState({ webhook_url: '', enabled: false });
            const [saved, setSaved] = React.useState(false);
            const [testing, setTesting] = React.useState(false);
            const [testResult, setTestResult] = React.useState(null);

            React.useEffect(() => {
                fetch(`${API_BASE}/feishu/config`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.webhook_url) setConfig(data);
                    })
                    .catch(() => {});
            }, []);

            const handleSave = async () => {
                try {
                    const res = await fetch(`${API_BASE}/feishu/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    if (res.ok) {
                        setSaved(true);
                        setTimeout(() => setSaved(false), 2000);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleTest = async () => {
                setTesting(true);
                setTestResult(null);
                try {
                    const res = await fetch(`${API_BASE}/feishu/test`, { method: 'POST' });
                    const data = await res.json();
                    setTestResult(data.success ? 'success' : 'failed');
                } catch (e) {
                    setTestResult('failed');
                }
                setTesting(false);
            };

            return (
                <div>
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Webhook 地址</label>
                            <input
                                type="text"
                                value={config.webhook_url}
                                onChange={e => setConfig({...config, webhook_url: e.target.value})}
                                placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxx"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>
                        <div className="flex items-center gap-4">
                            <label className="flex items-center gap-2 cursor-pointer">
                                <input
                                    type="checkbox"
                                    checked={config.enabled}
                                    onChange={e => setConfig({...config, enabled: e.target.checked})}
                                    className="w-4 h-4 text-blue-600 rounded"
                                />
                                <span className="text-sm text-gray-600">启用通知</span>
                            </label>
                        </div>
                        <div className="flex gap-3 pt-2">
                            <button
                                onClick={handleSave}
                                className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700"
                            >
                                {saved ? '✓ 已保存' : '保存配置'}
                            </button>
                            <button
                                onClick={handleTest}
                                disabled={testing}
                                className="px-4 py-2 bg-gray-100 text-gray-700 rounded-md text-sm hover:bg-gray-200 disabled:opacity-50"
                            >
                                {testing ? '测试中...' : '发送测试'}
                            </button>
                        </div>
                        {testResult && (
                            <div className={`text-sm ${testResult === 'success' ? 'text-green-600' : 'text-red-600'}`}>
                                {testResult === 'success' ? '✓ 测试消息发送成功！' : '✗ 发送失败，请检查Webhook地址'}
                            </div>
                        )}
                    </div>

                    <div className="mt-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <h3 className="font-medium text-gray-700 mb-2">📌 使用说明</h3>
                        <ol className="text-sm text-gray-600 space-y-1 list-decimal list-inside">
                            <li>在飞书群中添加"自定义机器人"</li>
                            <li>复制机器人 Webhook 地址</li>
                            <li>粘贴到上方输入框并保存</li>
                        </ol>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
