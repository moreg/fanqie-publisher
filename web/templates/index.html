        function FanqieBooks() {
            const [accounts, setAccounts] = React.useState([]);
            const [books, setBooks] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [syncing, setSyncing] = React.useState(false);
            const [selectedAccount, setSelectedAccount] = React.useState(null);

            const loadData = async () => {
                setLoading(true);
                try {
                    const [accRes, bookRes] = await Promise.all([
                        fetch(`${API_BASE}/accounts`),
                        fetch(`${API_BASE}/books`)
                    ]);
                    const accs = await accRes.json();
                    const bks = await bookRes.json();
                    setAccounts(accs);
                    setBooks(bks);
                } catch (e) {
                    console.error(e);
                }
                setLoading(false);
            };

            React.useEffect(() => {
                loadData();
            }, []);

            const handleSync = async () => {
                if (!selectedAccount) return;
                window.showConfirm('确定要同步所选账号的番茄书籍吗？这将重新从番茄网站获取书籍列表。', async () => {
                    setSyncing(true);
                    try {
                        const res = await fetch(`${API_BASE}/books/sync/${selectedAccount}`, { method: 'POST' });
                        const result = await res.json();
                        if (result.error) {
                            window.showToast('同步失败: ' + result.error, 'error');
                        } else {
                            window.showToast(`同步成功！新增 ${result.synced || 0} 本书籍，共 ${result.total || 0} 本`, 'success');
                            loadData();
                        }
                    } catch (e) {
                        window.showToast('同步失败: ' + e.message, 'error');
                    }
                    setSyncing(false);
                });
            };

            const activeAccounts = accounts.filter(a => a.has_cookies);
            // 过滤掉已完结和已隐藏的书籍
            const activeBooks = books.filter(b =>
                b.book_status !== 'completed' && b.book_status !== 'hidden'
            );
            const filteredBooks = activeBooks.filter(b => b.account_id === selectedAccount);

            const getAccountName = (accountId) => {
                const acc = accounts.find(a => a.id === accountId);
                return acc ? acc.name : '未知账号';
            };

            return (
                <div>
                    {/* 工具栏 */}
                    <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-4">
                            <label className="text-sm text-gray-600">选择账号:</label>
                            <select
                                value={selectedAccount || ''}
                                onChange={e => setSelectedAccount(Number(e.target.value))}
                                className="px-3 py-2 border border-gray-300 rounded-md text-sm"
                            >
                                <option value="">-- 请选择账号 --</option>
                                {activeAccounts.map(acc => (
                                    <option key={acc.id} value={acc.id}>{acc.name}</option>
                                ))}
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <button
                                onClick={handleSync}
                                disabled={!selectedAccount || syncing}
                                className="px-4 py-2 bg-orange-500 text-white rounded-md text-sm hover:bg-orange-600 disabled:opacity-50"
                            >
                                {syncing ? '同步中...' : '一键更新'}
                            </button>
                        </div>
                    </div>

                    {/* 统计信息 */}
                    <div className="grid grid-cols-3 gap-4 mb-6">
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                            <div className="text-blue-600 text-sm">账号总数</div>
                            <div className="text-2xl font-bold text-blue-700 mt-1">{accounts.length}</div>
                        </div>
                        <div className="bg-green-50 border border-green-200 rounded-lg p-4">
                            <div className="text-green-600 text-sm">有效账号</div>
                            <div className="text-2xl font-bold text-green-700 mt-1">{activeAccounts.length}</div>
                        </div>
                        <div className="bg-orange-50 border border-orange-200 rounded-lg p-4">
                            <div className="text-orange-600 text-sm">书籍总数</div>
                            <div className="text-2xl font-bold text-orange-700 mt-1">{filteredBooks.length}</div>
                        </div>
                    </div>

                    {/* 书籍列表 */}
                    {loading ? (
                        <div className="text-center py-8 text-gray-500">加载中...</div>
                    ) : filteredBooks.length === 0 ? (
                        <div className="text-center py-8 text-gray-400">
                            {selectedAccount ? '该账号暂无书籍，请点击"一键更新"同步' : '请选择账号'}
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {filteredBooks.map(book => (
                                <div key={book.id} className="border border-gray-200 rounded-lg p-4 hover:bg-gray-50">
                                    <div className="flex items-start justify-between">
                                        <div className="flex-1">
                                            <div className="font-medium text-gray-800">{book.book_name}</div>
                                            <div className="text-sm text-gray-500 mt-1">
                                                <span className="mr-4">ID: {book.fanqie_book_id}</span>
                                                <span className="mr-4">账号: {getAccountName(book.account_id)}</span>
                                                {book.local_folder && <span>路径: {book.local_folder}</span>}
                                            </div>
                                        </div>
                                        <span className={`px-2 py-1 text-xs rounded ${
                                            book.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-700'
                                        }`}>
                                            {book.status === 'active' ? '启用' : '禁用'}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function FeishuConfig() {
            const [config, setConfig] = React.useState({ webhook_url: '', enabled: false });
            const [saved, setSaved] = React.useState(false);
            const [testing, setTesting] = React.useState(false);
            const [testResult, setTestResult] = React.useState(null);

            React.useEffect(() => {
                fetch(`${API_BASE}/feishu/config`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.webhook_url) setConfig(data);
                    })
                    .catch(() => {});
            }, []);

            const handleSave = async () => {
                try {
                    const res = await fetch(`${API_BASE}/feishu/config`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(config)
                    });
                    if (res.ok) {
                        setSaved(true);
                        setTimeout(() => setSaved(false), 2000);
                    }
                } catch (e) {
                    console.error(e);
                }
            };

            const handleTest = async () => {
                setTesting(true);
                setTestResult(null);
                try {
                    const res = await fetch(`${API_BASE}/feishu/test`, { method: 'POST' });
                    const data = await res.json();
                    setTestResult(data.success ? 'success' : 'failed');
                } catch (e) {
                    setTestResult('failed');
                }
                setTesting(false);
            };

            return (
                <div>
                    <div className="space-y-4">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Webhook 地址</label>
                            <input
                                type="text"
                                value={config.webhook_url}
                                onChange={e => setConfig({...config, webhook_url: e.target.value})}
                                placeholder="https://open.feishu.cn/open-apis/bot/v2/hook/xxx"
                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                            />
                        </div>
                        <div className="flex items-center gap-4">
                            <label className="flex items-center gap-2 cursor-pointer">
                                <input
                                    type="checkbox"
                                    checked={config.enabled}
                                    onChange={e => setConfig({...config, enabled: e.target.checked})}
                                    className="w-4 h-4 text-blue-600 rounded"
                                />
                                <span className="text-sm text-gray-600">启用通知</span>
                            </label>
                        </div>
                        <div className="flex gap-3 pt-2">
                            <button
                                onClick={handleSave}
                                className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700"
                            >
                                {saved ? '✓ 已保存' : '保存配置'}
                            </button>
                            <button
                                onClick={handleTest}
                                disabled={testing}
                                className="px-4 py-2 bg-gray-100 text-gray-700 rounded-md text-sm hover:bg-gray-200 disabled:opacity-50"
                            >
                                {testing ? '测试中...' : '发送测试'}
                            </button>
                        </div>
                        {testResult && (
                            <div className={`text-sm ${testResult === 'success' ? 'text-green-600' : 'text-red-600'}`}>
                                {testResult === 'success' ? '✓ 测试消息发送成功！' : '✗ 发送失败，请检查Webhook地址'}
                            </div>
                        )}
                    </div>

                    <div className="mt-8 p-4 bg-gray-50 rounded-lg border border-gray-200">
                        <h3 className="font-medium text-gray-700 mb-2">📌 使用说明</h3>
                        <ol className="text-sm text-gray-600 space-y-1 list-decimal list-inside">
                            <li>在飞书群中添加"自定义机器人"</li>
                            <li>复制机器人 Webhook 地址</li>
                            <li>粘贴到上方输入框并保存</li>
                        </ol>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
