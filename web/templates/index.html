<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>番茄小说自动发布器</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const API_BASE = '/api';

        // 确认弹窗组件
        function ConfirmDialog() {
            const [dialog, setDialog] = React.useState(null);

            React.useEffect(() => {
                window.showConfirm = (message, onConfirm, onCancel) => {
                    setDialog({ message, onConfirm: onConfirm || (() => {}), onCancel: onCancel || (() => {}) });
                };
            }, []);

            if (!dialog) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center">
                    <div className="absolute inset-0 bg-black bg-opacity-50" onClick={() => { dialog.onCancel(); setDialog(null); }}></div>
                    <div className="relative bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
                        <div className="p-6">
                            <div className="flex items-center gap-4 mb-4">
                                <div className="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center">
                                    <span className="text-2xl">⚠️</span>
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-lg font-semibold text-gray-800">确认操作</h3>
                                    <p className="text-gray-500 text-sm mt-1">{dialog.message}</p>
                                </div>
                            </div>
                        </div>
                        <div className="bg-gray-50 px-6 py-4 flex justify-end gap-3">
                            <button onClick={() => { dialog.onCancel(); setDialog(null); }}
                                className="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors">
                                取消
                            </button>
                            <button onClick={() => { dialog.onConfirm(); setDialog(null); }}
                                className="px-4 py-2 text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors">
                                确认删除
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Toast 提示组件
        function Toast() {
            const [toasts, setToasts] = React.useState([]);

            React.useEffect(() => {
                window.showToast = (message, type = 'info', duration = 3000) => {
                    const id = Date.now();
                    setToasts(prev => [...prev, { id, message, type }]);
                    setTimeout(() => {
                        setToasts(prev => prev.filter(t => t.id !== id));
                    }, duration);
                };
            }, []);

            const getStyles = (type) => {
                switch(type) {
                    case 'success': return 'bg-green-500 text-white';
                    case 'error': return 'bg-red-500 text-white';
                    case 'warning': return 'bg-yellow-500 text-white';
                    default: return 'bg-blue-500 text-white';
                }
            };

            const getIcon = (type) => {
                switch(type) {
                    case 'success': return '✓';
                    case 'error': return '✕';
                    case 'warning': return '⚠';
                    default: return 'ℹ';
                }
            };

            return (
                <div className="fixed top-4 right-4 z-50 space-y-2">
                    {toasts.map(toast => (
                        <div key={toast.id} className={`${getStyles(toast.type)} px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 min-w-64 animate-slide-in`}>
                            <span className="text-lg">{getIcon(toast.type)}</span>
                            <span className="flex-1">{toast.message}</span>
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const [currentPage, setCurrentPage] = React.useState('dashboard');
            const [stats, setStats] = React.useState({});

            React.useEffect(() => {
                fetch(`${API_BASE}/logs/stats`)
                    .then(r => r.json())
                    .then(setStats)
                    .catch(() => {});
            }, []);

            return (
                <div className="min-h-screen bg-gray-100">
                    <Toast />
                    <ConfirmDialog />
                    {/* 顶部导航 */}
                    <div className="bg-white shadow-sm border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <h1 className="text-2xl font-bold text-gray-800">🍅 番茄小说自动发布器</h1>
                        </div>
                    </div>

                    <div className="flex max-w-7xl mx-auto mt-6 px-4">
                        {/* 侧边栏 */}
                        <div className="w-56 bg-white rounded-lg shadow-sm border border-gray-200 p-4 mr-6">
                            <nav className="space-y-1">
                                {[
                                    { id: 'dashboard', label: '仪表盘', icon: '📊' },
                                    { id: 'accounts', label: '账号管理', icon: '👤' },
                                    { id: 'fanqie-books', label: '番茄书籍', icon: '🍅' },
                                    { id: 'books', label: '本地书籍', icon: '📚' },
                                    { id: 'schedules', label: '定时任务', icon: '⏰' },
                                    { id: 'tasks', label: '待发布', icon: '📋' },
                                    { id: 'logs', label: '发布日志', icon: '📝' },
                                    { id: 'feishu', label: '飞书配置', icon: '🔔' },
                                ].map(item => (
                                    <button
                                        key={item.id}
                                        onClick={() => setCurrentPage(item.id)}
                                        className={`w-full text-left px-4 py-3 rounded-md flex items-center gap-3 text-sm font-medium transition-colors ${
                                            currentPage === item.id
                                                ? 'bg-blue-50 text-blue-600 border border-blue-200'
                                                : 'text-gray-600 hover:bg-gray-50'
                                        }`}
                                    >
                                        <span>{item.icon}</span>
                                        <span>{item.label}</span>
                                    </button>
                                ))}
                            </nav>
                        </div>

                        {/* 主内容 */}
                        <div className="flex-1">
                            <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                                <h2 className="text-xl font-semibold text-gray-800 mb-6">
                                    {currentPage === 'dashboard' && '📊 仪表盘'}
                                    {currentPage === 'accounts' && '👤 账号管理'}
                                    {currentPage === 'fanqie-books' && '🍅 番茄书籍'}
                                    {currentPage === 'books' && '📚 本地书籍'}
                                    {currentPage === 'schedules' && '⏰ 定时任务'}
                                    {currentPage === 'tasks' && '📋 待发布任务'}
                                    {currentPage === 'logs' && '📝 发布日志'}
                                    {currentPage === 'feishu' && '🔔 飞书配置'}
                                </h2>

                                {currentPage === 'dashboard' && <Dashboard stats={stats} />}
                                {currentPage === 'accounts' && <Accounts />}
                                {currentPage === 'fanqie-books' && <FanqieBooks />}
                                {currentPage === 'books' && <Books />}
                                {currentPage === 'schedules' && <Schedules />}
                                {currentPage === 'tasks' && <Tasks />}
                                {currentPage === 'logs' && <Logs />}
                                {currentPage === 'feishu' && <FeishuConfig />}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function Dashboard({ stats }) {
            return (
                <div className="grid grid-cols-4 gap-4">
                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                        <div className="text-blue-600 text-sm">总章节数</div>
                        <div className="text-2xl font-bold text-blue-700 mt-1">{stats.total_chapters || 0}</div>
                    </div>
                    <div className="bg-green-50 border border-green-200 rounded-lg p-4">
                        <div className="text-green-600 text-sm">已发布</div>
                        <div className="text-2xl font-bold text-green-700 mt-1">{stats.published_chapters || 0}</div>
                    </div>
                    <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-4">
                        <div className="text-emerald-600 text-sm">发布成功</div>
                        <div className="text-2xl font-bold text-emerald-700 mt-1">{stats.successful_publishes || 0}</div>
                    </div>
                    <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div className="text-red-600 text-sm">发布失败</div>
                        <div className="text-2xl font-bold text-red-700 mt-1">{stats.failed_publishes || 0}</div>
                    </div>
                </div>
            );
        }

        function Accounts() {
            const [accounts, setAccounts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showAdd, setShowAdd] = React.useState(false);
            const [editId, setEditId] = React.useState(null);
            const [form, setForm] = React.useState({ name: '', phone: '', cookies: '' });
            const [showCookieHelp, setShowCookieHelp] = React.useState(false);

            const loadAccounts = () => {
                setLoading(true);
                fetch(`${API_BASE}/accounts`)
                    .then(r => r.json())
                    .then(data => setAccounts(Array.isArray(data) ? data : (data.accounts || [])))
                    .catch(() => setAccounts([]))
                    .finally(() => setLoading(false));
            };

            React.useEffect(() => { loadAccounts(); }, []);

            const handleAdd = async () => {
                if (!form.name) return;
                const payload = {
                    name: form.name,
                    phone: form.phone,
                    cookies: form.cookies || null
                };
                await fetch(`${API_BASE}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                setForm({ name: '', phone: '', cookies: '' });
                setShowAdd(false);
                loadAccounts();
            };

            const handleEdit = (acc) => {
                setEditId(acc.id);
                setForm({ name: acc.name, phone: acc.phone || '', cookies: '' });
                setShowAdd(false);
            };

            const handleUpdate = async () => {
                if (!form.name || !editId) return;
                const payload = {
                    name: form.name,
                    phone: form.phone,
                    cookies: form.cookies || null
                };
                await fetch(`${API_BASE}/accounts/${editId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                setForm({ name: '', phone: '', cookies: '' });
                setEditId(null);
                loadAccounts();
            };

            const handleDelete = async (id) => {
                window.showConfirm('确定删除这个账号？', async () => {
                    await fetch(`${API_BASE}/accounts/${id}`, { method: 'DELETE' });
                    loadAccounts();
                    window.showToast('删除成功', 'success');
                });
            };

            const handleCancel = () => {
                setShowAdd(false);
                setEditId(null);
                setForm({ name: '', phone: '', cookies: '' });
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">共 {accounts.length} 个账号</span>
                        <button onClick={() => { setShowAdd(!showAdd); setEditId(null); setForm({ name: '', phone: '', cookies: '' }); }}
                            className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">
                            {showAdd ? '取消' : '+ 添加账号'}
                        </button>
                    </div>

                    {(showAdd || editId) && (
                        <div className="mb-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <div className="grid grid-cols-1 gap-4">
                                <input type="text" placeholder="账号名称 *" value={form.name}
                                    onChange={e => setForm({...form, name: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                <input type="text" placeholder="手机号(可选)" value={form.phone}
                                    onChange={e => setForm({...form, phone: e.target.value})}
                                    className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                <div>
                                    <div className="flex items-center justify-between mb-1">
                                        <label className="text-sm text-gray-600">Cookie (可选)</label>
                                        <button onClick={() => setShowCookieHelp(!showCookieHelp)}
                                            className="text-xs text-blue-600 hover:text-blue-800">
                                            {showCookieHelp ? '收起' : '如何获取?'}
                                        </button>
                                    </div>
                                    <textarea placeholder='name=value; name=value; ...'
                                        value={form.cookies}
                                        onChange={e => setForm({...form, cookies: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm font-mono"
                                        rows="4" />
                                    {showCookieHelp && (
                                        <div className="mt-2 p-2 bg-blue-50 rounded text-xs text-blue-800">
                                            <p><strong>获取Cookie方法:</strong></p>
                                            <p>1. 在Chrome/Edge浏览器登录 fanqienovel.com</p>
                                            <p>2. 按 F12 打开开发者工具</p>
                                            <p>3. 切换到 Application (应用) 标签</p>
                                            <p>4. 左侧选择 Cookies → https://fanqienovel.com</p>
                                            <p>5. 复制所有 cookie（支持字符串格式或JSON格式）</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="flex gap-2 mt-3">
                                <button onClick={editId ? handleUpdate : handleAdd}
                                    className="px-4 py-2 bg-green-600 text-white rounded-md text-sm hover:bg-green-700">
                                    {editId ? '保存修改' : '确认添加'}
                                </button>
                                {(showAdd || editId) && (
                                    <button onClick={handleCancel}
                                        className="px-4 py-2 bg-gray-200 text-gray-700 rounded-md text-sm hover:bg-gray-300">
                                        取消
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                    {accounts.length === 0 && !showAdd && !editId ? (
                        <div className="text-gray-400 text-center py-8">暂无账号，点击上方按钮添加</div>
                    ) : accounts.length > 0 ? (
                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-gray-500 border-b">
                                    <th className="pb-2">ID</th>
                                    <th className="pb-2">名称</th>
                                    <th className="pb-2">手机号</th>
                                    <th className="pb-2">Cookie</th>
                                    <th className="pb-2">状态</th>
                                    <th className="pb-2">操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                {accounts.map(acc => (
                                    <tr key={acc.id} className="border-b border-gray-100 hover:bg-gray-50">
                                        <td className="py-3">{acc.id}</td>
                                        <td className="py-3">{acc.name}</td>
                                        <td className="py-3">{acc.phone || '-'}</td>
                                        <td className="py-3">
                                            {acc.has_cookies ? (
                                                <span className="px-2 py-1 rounded text-xs bg-green-100 text-green-700">已配置</span>
                                            ) : (
                                                <span className="px-2 py-1 rounded text-xs bg-gray-100 text-gray-500">未配置</span>
                                            )}
                                        </td>
                                        <td className="py-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                acc.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'
                                            }`}>
                                                {acc.status === 'active' ? '已登录' : '未登录'}
                                            </span>
                                        </td>
                                        <td className="py-3">
                                            <button onClick={() => handleEdit(acc)}
                                                className="px-2 py-1 text-xs bg-blue-100 text-blue-700 rounded hover:bg-blue-200 mr-1">
                                                编辑
                                            </button>
                                            <button onClick={() => handleDelete(acc.id)}
                                                className="px-2 py-1 text-xs bg-red-100 text-red-700 rounded hover:bg-red-200">
                                                删除
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    ) : null}
                </div>
            );
        }

        function Books() {
            const [localBooks, setLocalBooks] = React.useState([]);
            const [accounts, setAccounts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [expandedBooks, setExpandedBooks] = React.useState({});
            const [showAdd, setShowAdd] = React.useState(false);
            const [form, setForm] = React.useState({ book_name: '', account_id: '', local_folder: '' });
            const [publishModal, setPublishModal] = React.useState(null);

            const loadData = () => {
                setLoading(true);
                Promise.all([
                    fetch(`${API_BASE}/local-books`).then(r => r.json()),
                    fetch(`${API_BASE}/accounts`).then(r => r.json())
                ]).then(([booksData, accountsData]) => {
                    if (Array.isArray(booksData)) setLocalBooks(booksData);
                    else setLocalBooks([]);
                    setAccounts(Array.isArray(accountsData) ? accountsData : (accountsData.accounts || []));
                }).catch(() => {
                    setLocalBooks([]);
                    setAccounts([]);
                }).finally(() => setLoading(false));
            };

            React.useEffect(() => { loadData(); }, []);

            const toggleBook = (bookId) => {
                setExpandedBooks(prev => ({ ...prev, [bookId]: !prev[bookId] }));
            };

            const handlePublish = (book, chapter) => {
                setPublishModal({ book, chapter });
            };

            const handlePublishNow = async () => {
                if (!publishModal) return;

                // 获取最近的待发布时间，确保与最近任务间隔至少3分钟
                let scheduledDate = new Date();
                scheduledDate.setMinutes(scheduledDate.getMinutes() + 1);

                try {
                    const response = await fetch(`${API_BASE}/tasks`);
                    const tasks = await response.json();
                    if (Array.isArray(tasks)) {
                        const now = new Date();
                        const threeMinutesLater = new Date(now.getTime() + 3 * 60 * 1000);

                        // 找出最近的任务时间
                        let nearestTaskTime = null;
                        for (const task of tasks) {
                            if (task.status === 'pending' || task.status === 'publishing') {
                                const taskTime = new Date(task.scheduled_time);
                                if (taskTime > now && taskTime < threeMinutesLater) {
                                    if (!nearestTaskTime || taskTime > nearestTaskTime) {
                                        nearestTaskTime = taskTime;
                                    }
                                }
                            }
                        }

                        // 如果有任务在3分钟内，将新任务设为最近任务+3分钟
                        if (nearestTaskTime) {
                            scheduledDate = new Date(nearestTaskTime.getTime() + 3 * 60 * 1000);
                            window.showToast('与最近任务间隔太近，已调整到3分钟后', 'warning');
                        }
                    }
                } catch (e) {
                    console.error('获取任务列表失败:', e);
                }

                const pad = n => n.toString().padStart(2, '0');
                const localISO = `${scheduledDate.getFullYear()}-${pad(scheduledDate.getMonth()+1)}-${pad(scheduledDate.getDate())}T${pad(scheduledDate.getHours())}:${pad(scheduledDate.getMinutes())}:${pad(scheduledDate.getSeconds())}`;

                await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        book_id: publishModal.book.id,
                        chapter_file: publishModal.chapter.file_path,
                        chapter_title: publishModal.chapter.chapter_title,
                        scheduled_time: localISO
                    })
                });
                setPublishModal(null);
                window.showToast('已添加到待发布队列', 'success');
            };

            const handlePublishAtTime = async (time) => {
                if (!publishModal || !time) return;

                // 检查与最近任务的间隔
                let finalTime = time;

                try {
                    const response = await fetch(`${API_BASE}/tasks`);
                    const tasks = await response.json();
                    if (Array.isArray(tasks)) {
                        const selectedTime = new Date(time);
                        const now = new Date();

                        // 找出最近的任务时间
                        let nearestTaskTime = null;
                        for (const task of tasks) {
                            if (task.status === 'pending' || task.status === 'publishing') {
                                const taskTime = new Date(task.scheduled_time);
                                const diff = Math.abs(taskTime.getTime() - selectedTime.getTime());
                                if (diff < 3 * 60 * 1000) { // 3分钟
                                    if (!nearestTaskTime || diff < Math.abs(nearestTaskTime.getTime() - selectedTime.getTime())) {
                                        nearestTaskTime = taskTime;
                                    }
                                }
                            }
                        }

                        // 如果与最近任务间隔不足3分钟，调整到+3分钟
                        if (nearestTaskTime) {
                            const nearestDiff = Math.abs(nearestTaskTime.getTime() - selectedTime.getTime());
                            if (nearestDiff < 3 * 60 * 1000) {
                                const newTime = new Date(nearestTaskTime.getTime() + 3 * 60 * 1000);
                                const pad = n => n.toString().padStart(2, '0');
                                finalTime = `${newTime.getFullYear()}-${pad(newTime.getMonth()+1)}-${pad(newTime.getDate())}T${pad(newTime.getHours())}:${pad(newTime.getMinutes())}:${pad(newTime.getSeconds())}`;
                                window.showToast('与最近任务间隔太近，已调整到3分钟后', 'warning');
                            }
                        }
                    }
                } catch (e) {
                    console.error('获取任务列表失败:', e);
                }

                await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        book_id: publishModal.book.id,
                        chapter_file: publishModal.chapter.file_path,
                        chapter_title: publishModal.chapter.chapter_title,
                        scheduled_time: finalTime
                    })
                });
                setPublishModal(null);
                window.showToast('已添加到待发布队列', 'success');
            };

            const handleAdd = async () => {
                if (!form.book_name || !form.account_id || !form.local_folder) {
                    window.showToast('请填写完整信息', 'warning');
                    return;
                }
                await fetch(`${API_BASE}/books`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        account_id: parseInt(form.account_id),
                        book_name: form.book_name,
                        fanqie_book_id: '',
                        local_folder: form.local_folder
                    })
                });
                setForm({ book_name: '', account_id: '', local_folder: '' });
                setShowAdd(false);
                loadData();
                window.showToast('添加成功', 'success');
            };

            const handleDelete = async (bookId) => {
                window.showConfirm('确定删除这本书籍？', async () => {
                    await fetch(`${API_BASE}/books/${bookId}`, { method: 'DELETE' });
                    loadData();
                    window.showToast('删除成功', 'success');
                });
            };

            const handleOpenFolder = async (bookId) => {
                try {
                    const response = await fetch(`${API_BASE}/books/${bookId}/open-folder`, { method: 'POST' });
                    const data = await response.json();
                    if (!response.ok) {
                        window.showToast(data.error || '打开文件夹失败', 'error');
                    }
                } catch (e) {
                    window.showToast('打开文件夹失败', 'error');
                }
            };

            const activeBooks = localBooks.filter(b => b.exists);
            const errorBooks = localBooks.filter(b => !b.exists);

            // 计算每本书的待发布章节数
            const getPendingCount = (book) => {
                return book.chapters.filter(ch => ch.publish_status !== 'published').length;
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex items-center gap-3">
                            <span className="text-gray-600">共 {activeBooks.length} 本本地书籍</span>
                            <button onClick={() => loadData()}
                                className="px-3 py-1 text-gray-600 bg-gray-100 rounded-md text-sm hover:bg-gray-200 flex items-center gap-1">
                                <span>↻</span> 刷新
                            </button>
                        </div>
                        <button onClick={() => setShowAdd(!showAdd)}
                            className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">
                            {showAdd ? '取消' : '+ 添加书籍'}
                        </button>
                    </div>

                    {showAdd && (
                        <div className="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <h3 className="font-medium text-gray-700 mb-4">添加本地书籍</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">账号</label>
                                    <select value={form.account_id}
                                        onChange={e => setForm({...form, account_id: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                        <option value="">选择账号</option>
                                        {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">书名</label>
                                    <input type="text" placeholder="输入书名" value={form.book_name}
                                        onChange={e => setForm({...form, book_name: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm text-gray-600 mb-1">本地文件夹路径</label>
                                    <div className="flex gap-2">
                                        <input type="text" placeholder="选择或输入本地文件夹路径" value={form.local_folder}
                                            onChange={e => setForm({...form, local_folder: e.target.value})}
                                            className="flex-1 px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                        <label className="px-4 py-2 bg-gray-100 text-gray-700 rounded-md text-sm hover:bg-gray-200 cursor-pointer flex items-center">
                                            浏览
                                            <input type="file" className="hidden" webkitdirectory=""
                                                onChange={e => {
                                                    if (e.target.files && e.target.files.length > 0) {
                                                        const file = e.target.files[0];
                                                        if (file.webkitRelativePath) {
                                                            const parts = file.webkitRelativePath.split('/');
                                                            parts.pop();
                                                            setForm({...form, local_folder: parts.join('/')});
                                                        }
                                                    }
                                                }}
                                            />
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <button onClick={handleAdd}
                                className="mt-4 px-4 py-2 bg-green-600 text-white rounded-md text-sm hover:bg-green-700">
                                确认添加
                            </button>
                        </div>
                    )}

                    {localBooks.length === 0 ? (
                        <div className="text-gray-400 text-center py-8">
                            暂无本地书籍<br/>
                            <span className="text-sm">请在"番茄书籍"页面选择书籍并设置本地文件夹路径</span>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {activeBooks.map(book => {
                                const pendingCount = getPendingCount(book);
                                return (
                                <div key={book.id} className="border border-gray-200 rounded-lg overflow-hidden">
                                    <div className="bg-gray-50 px-4 py-3 flex items-center justify-between">
                                        <div className="flex-1 cursor-pointer hover:bg-gray-100" onClick={() => toggleBook(book.id)}>
                                            <div className="font-medium text-gray-800">{book.book_name}</div>
                                            <div className="text-sm text-gray-500 mt-1">
                                                <span className="mr-4">📁 {book.local_folder}</span>
                                                <span className="mr-4">📖 {book.total_chapters} 章</span>
                                                <span className="mr-4">✍️ {book.total_words.toLocaleString()} 字</span>
                                                {pendingCount < book.total_chapters && (
                                                    <span className="text-orange-600">待发布: {pendingCount} 章</span>
                                                )}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button onClick={() => handleOpenFolder(book.id)}
                                                className="px-3 py-1 text-xs bg-blue-100 text-blue-600 rounded hover:bg-blue-200" title="打开文件夹">
                                                📂
                                            </button>
                                            <button onClick={() => handleDelete(book.id)}
                                                className="px-3 py-1 text-xs bg-red-100 text-red-600 rounded hover:bg-red-200">
                                                删除
                                            </button>
                                            <span className="text-gray-400">{expandedBooks[book.id] ? '▲' : '▼'}</span>
                                        </div>
                                    </div>
                                    {expandedBooks[book.id] && (
                                        <div className="border-t border-gray-200">
                                            {book.chapters.filter(ch => ch.publish_status !== 'published').length === 0 ? (
                                                <div className="p-4 text-gray-400 text-center">所有章节已发布完成</div>
                                            ) : (
                                                <div className="max-h-96 overflow-y-auto">
                                                    {book.chapters
                                                        .filter(ch => ch.publish_status !== 'published')
                                                        .map((ch, idx) => (
                                                        <div key={idx} className="px-4 py-2 border-b border-gray-100 last:border-b-0 hover:bg-gray-50">
                                                            <div className="flex items-center justify-between">
                                                                <div className="flex-1">
                                                                    <span className="text-blue-600 font-medium">{ch.chapter_title}</span>
                                                                    <span className="text-sm text-gray-400 ml-3">第{ch.chapter_number}章 · {ch.word_count.toLocaleString()}字</span>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    {ch.publish_status === 'published' && (
                                                                        <span className="px-3 py-1 text-xs bg-green-100 text-green-600 rounded-full">
                                                                            已发布
                                                                        </span>
                                                                    )}
                                                                    {ch.publish_status === 'pending' && (
                                                                        <span className="px-3 py-1 text-xs bg-yellow-100 text-yellow-600 rounded-full">
                                                                            待发布
                                                                        </span>
                                                                    )}
                                                                    {ch.publish_status === 'failed' && (
                                                                        <button onClick={() => handlePublish(book, ch)}
                                                                            className="px-3 py-1 text-xs bg-red-100 text-red-600 rounded hover:bg-red-200">
                                                                            重新发布
                                                                        </button>
                                                                    )}
                                                                    {ch.publish_status === 'none' && (
                                                                        <button onClick={() => handlePublish(book, ch)}
                                                                            className="px-3 py-1 text-xs bg-blue-100 text-blue-600 rounded hover:bg-blue-200">
                                                                            发布
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                                );
                            })}

                            {errorBooks.length > 0 && (
                                <div className="mt-6">
                                    <div className="text-sm text-gray-500 mb-2 font-medium">⚠️ 无法访问的书籍</div>
                                    {errorBooks.map(book => (
                                        <div key={book.id} className="border border-red-200 rounded-lg p-3 mb-2 bg-red-50 flex items-center justify-between">
                                            <div>
                                                <div className="font-medium text-gray-700">{book.book_name}</div>
                                                <div className="text-sm text-red-500 mt-1">{book.error}</div>
                                            </div>
                                            <button onClick={() => handleDelete(book.id)}
                                                className="px-3 py-1 text-xs bg-red-100 text-red-600 rounded hover:bg-red-200">
                                                删除
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    )}

                    {/* 发布弹窗 */}
                    {publishModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center">
                            <div className="absolute inset-0 bg-black bg-opacity-50" onClick={() => setPublishModal(null)}></div>
                            <div className="relative bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
                                <div className="p-6">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-4">发布章节</h3>
                                    <div className="mb-4">
                                        <div className="text-sm text-gray-500 mb-1">书籍</div>
                                        <div className="font-medium text-gray-800">{publishModal.book.book_name}</div>
                                    </div>
                                    <div className="mb-4">
                                        <div className="text-sm text-gray-500 mb-1">章节</div>
                                        <div className="font-medium text-gray-800">{publishModal.chapter.chapter_title}</div>
                                        <div className="text-sm text-gray-400">{publishModal.chapter.word_count.toLocaleString()} 字</div>
                                    </div>
                                    <div className="mb-4">
                                        <label className="block text-sm text-gray-600 mb-2">选择发布时间</label>
                                        <input type="datetime-local" id="publishTime"
                                            defaultValue={(() => {
                                                const d = new Date();
                                                d.setMinutes(d.getMinutes() + 30);
                                                const pad = n => n.toString().padStart(2, '0');
                                                return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                                            })()}
                                            min={new Date().toISOString().slice(0, 16)}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm" />
                                    </div>
                                </div>
                                <div className="bg-gray-50 px-6 py-4 flex justify-end gap-3">
                                    <button onClick={handlePublishNow}
                                        className="px-4 py-2 text-white bg-orange-500 rounded-lg hover:bg-orange-600 transition-colors">
                                        立即发布（延后1分钟）
                                    </button>
                                    <button onClick={() => {
                                        const timeInput = document.getElementById('publishTime');
                                        if (timeInput && timeInput.value) {
                                            handlePublishAtTime(timeInput.value);
                                        } else {
                                            window.showToast('请选择发布时间', 'warning');
                                        }
                                    }}
                                        className="px-4 py-2 text-white bg-green-500 rounded-lg hover:bg-green-600 transition-colors">
                                        确认发布
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Schedules() {
            const [schedules, setSchedules] = React.useState([]);
            const [books, setBooks] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [showAdd, setShowAdd] = React.useState(false);
            const [form, setForm] = React.useState({
                book_id: '',
                publish_mode: 'chapters',
                chapters_per_run: 2,
                start_chapter: 1,
                schedule_type: 'daily',
                schedule_time: '08:00'
            });
            const [preview, setPreview] = React.useState(null);
            const [previewing, setPreviewing] = React.useState(false);

            const loadData = () => {
                setLoading(true);
                Promise.all([
                    fetch(`${API_BASE}/schedules`).then(r => r.json()),
                    fetch(`${API_BASE}/books`).then(r => r.json())
                ]).then(([schedData, booksData]) => {
                    setSchedules(Array.isArray(schedData) ? schedData : []);
                    setBooks(Array.isArray(booksData) ? booksData : (booksData.books || []));
                }).catch(() => {
                    setSchedules([]);
                    setBooks([]);
                }).finally(() => setLoading(false));
            };

            React.useEffect(() => { loadData(); }, []);

            const handleBookChange = (bookId) => {
                setForm({...form, book_id: bookId});
                setPreview(null);
            };

            // 根据选择生成 cron 表达式
            const generateCronExpression = (scheduleType, scheduleTime) => {
                const [hours, minutes] = scheduleTime.split(':');
                switch (scheduleType) {
                    case 'daily_once': return `${minutes} ${hours} * * *`;
                    case 'daily_twice': return `0 8,20 * * *`;
                    case 'weekly_sunday': return `${minutes} ${hours} * * 0`;
                    case 'weekly_monday': return `${minutes} ${hours} * * 1`;
                    case 'weekly_weekend': return `${minutes} ${hours} * * 0,6`;
                    case 'weekly_workday': return `${minutes} ${hours} * * 1-5`;
                    default: return `${minutes} ${hours} * * *`;
                }
            };

            // 获取中文描述
            const getScheduleDesc = (scheduleType, scheduleTime) => {
                const [hours] = scheduleTime.split(':');
                const timeStr = `${hours}:00`;
                switch (scheduleType) {
                    case 'daily_once': return `每天 ${timeStr}`;
                    case 'daily_twice': return `每天 8:00 和 20:00`;
                    case 'weekly_sunday': return `每周日 ${timeStr}`;
                    case 'weekly_monday': return `每周一 ${timeStr}`;
                    case 'weekly_weekend': return `每周六日 ${timeStr}`;
                    case 'weekly_workday': return `工作日 ${timeStr}`;
                    default: return `每天 ${timeStr}`;
                }
            };

            const handlePreview = async () => {
                if (!form.book_id) {
                    alert('请先选择书籍');
                    return;
                }
                if (form.chapters_per_run <= 0) {
                    alert('发布数量必须大于0');
                    return;
                }
                setPreviewing(true);
                try {
                    const res = await fetch(`${API_BASE}/schedules/preview`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            book_id: parseInt(form.book_id),
                            publish_mode: form.publish_mode,
                            target_value: parseInt(form.chapters_per_run),
                            start_chapter: parseInt(form.start_chapter)
                        })
                    });
                    const data = await res.json();
                    setPreview(data);
                } catch (e) {
                    alert('预览失败: ' + e.message);
                }
                setPreviewing(false);
            };

            const handleAdd = async () => {
                if (!form.book_id) {
                    alert('请选择书籍');
                    return;
                }
                const cronExpression = generateCronExpression(form.schedule_type, form.schedule_time);
                await fetch(`${API_BASE}/schedules`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        book_id: parseInt(form.book_id),
                        publish_mode: form.publish_mode,
                        target_value: parseInt(form.chapters_per_run),
                        start_chapter: parseInt(form.start_chapter),
                        cron_expression: cronExpression
                    })
                });
                setForm({ book_id: '', publish_mode: 'chapters', chapters_per_run: 2, start_chapter: 1, schedule_type: 'daily_once', schedule_time: '08:00' });
                setPreview(null);
                setShowAdd(false);
                loadData();
            };

            const handleToggle = async (schedule) => {
                await fetch(`${API_BASE}/schedules/${schedule.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_active: !schedule.is_active })
                });
                loadData();
            };

            const handleDelete = async (id) => {
                window.showConfirm('确定删除这个定时任务？', async () => {
                    await fetch(`${API_BASE}/schedules/${id}`, { method: 'DELETE' });
                    loadData();
                    window.showToast('删除成功', 'success');
                });
            };

            const [editingSchedule, setEditingSchedule] = React.useState(null);
            const [schedulePreviews, setSchedulePreviews] = React.useState({});

            const loadSchedulePreview = async (schedule) => {
                try {
                    const response = await fetch(`${API_BASE}/schedules/preview`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            book_id: schedule.book_id,
                            publish_mode: schedule.publish_mode,
                            target_value: schedule.target_value,
                            start_chapter: schedule.start_chapter || 1
                        })
                    });
                    const data = await response.json();
                    setSchedulePreviews(prev => ({ ...prev, [schedule.id]: data }));
                } catch (e) {
                    console.error('预览失败:', e);
                }
            };

            const handleEdit = (schedule) => {
                // 从 cron 表达式解析出 schedule_type 和 schedule_time
                const parts = schedule.cron_expression.split(' ');
                if (parts.length === 5) {
                    const [minute, hour, , , days] = parts;
                    let schedule_type = 'daily_once';
                    let schedule_time = `${hour}:${minute}`;

                    if (days === '1-5') {
                        schedule_type = 'weekly_workday';
                    } else if (days === '0,6') {
                        schedule_type = 'weekly_weekend';
                    } else if (days === '0') {
                        schedule_type = 'weekly_sunday';
                    } else if (days === '1') {
                        schedule_type = 'weekly_monday';
                    } else if (hour === '8,20' && minute === '0') {
                        schedule_type = 'daily_twice';
                        schedule_time = '08:00';
                    }

                    setEditingSchedule({
                        ...schedule,
                        schedule_type,
                        schedule_time
                    });
                } else {
                    setEditingSchedule({
                        ...schedule,
                        schedule_type: 'daily_once',
                        schedule_time: '08:00'
                    });
                }
            };

            const handleSaveEdit = async () => {
                if (!editingSchedule) return;

                const cron = editingSchedule.schedule_type === 'daily_twice'
                    ? '0 8,20 * * *'
                    : (() => {
                        const [hours, minutes] = editingSchedule.schedule_time.split(':');
                        switch (editingSchedule.schedule_type) {
                            case 'daily_once': return `${minutes} ${hours} * * *`;
                            case 'weekly_sunday': return `${minutes} ${hours} * * 0`;
                            case 'weekly_monday': return `${minutes} ${hours} * * 1`;
                            case 'weekly_weekend': return `${minutes} ${hours} * * 0,6`;
                            case 'weekly_workday': return `${minutes} ${hours} * * 1-5`;
                            default: return `${minutes} ${hours} * * *`;
                        }
                    })();

                await fetch(`${API_BASE}/schedules/${editingSchedule.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cron_expression: cron,
                        publish_mode: editingSchedule.publish_mode,
                        target_value: parseInt(editingSchedule.target_value),
                        start_chapter: parseInt(editingSchedule.start_chapter || 1),
                        is_active: editingSchedule.is_active
                    })
                });
                setEditingSchedule(null);
                loadData();
                window.showToast('修改成功', 'success');
            };

            // 生成 cron 表达式帮助文本
            const getCronHelp = (cron) => {
                const parts = cron.split(' ');
                if (parts.length !== 5) return cron;
                const [, minutes, hours, , , days] = parts;
                if (hours === '8,20' && minutes === '0') return '每天 8:00 和 20:00';
                if (hours === '*' && minutes === '0') return '每小时整点';
                if (minutes === '0' && hours !== '*') return `每天 ${hours}:00`;
                if (days === '1' && minutes !== '*') return `每周一 ${hours}:${minutes}`;
                if (days === '0,6' && minutes !== '*') return `每周六日 ${hours}:${minutes}`;
                if (days === '1-5' && minutes !== '*') return `工作日 ${hours}:${minutes}`;
                return cron;
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">共 {schedules.length} 个定时任务</span>
                        <button onClick={() => setShowAdd(!showAdd)}
                            className="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">
                            {showAdd ? '取消' : '+ 添加定时任务'}
                        </button>
                    </div>

                    {showAdd && (
                        <div className="mb-6 p-4 bg-gray-50 rounded-lg border border-gray-200">
                            <h3 className="font-medium text-gray-700 mb-4">新建定时任务</h3>
                            <div className="grid grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">选择书籍</label>
                                    <select value={form.book_id}
                                        onChange={e => handleBookChange(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                        <option value="">-- 选择书籍 --</option>
                                        {books.filter(b => b.book_status !== 'completed' && b.book_status !== 'hidden').map(b => <option key={b.id} value={b.id}>{b.book_name} ({b.account_name})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">
                                        {form.publish_mode === 'chapters' ? '每次发布章节数' : '每次发布字数'}
                                    </label>
                                    <input type="number" min="1" value={form.chapters_per_run}
                                        onChange={e => { setForm({...form, chapters_per_run: parseInt(e.target.value) || 1}); setPreview(null); }}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">起始章节</label>
                                    <input type="number" min="1" value={form.start_chapter}
                                        onChange={e => { setForm({...form, start_chapter: parseInt(e.target.value) || 1}); setPreview(null); }}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm"
                                        placeholder="从第几章开始" />
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">发布方式</label>
                                    <select value={form.publish_mode}
                                        onChange={e => setForm({...form, publish_mode: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                        <option value="chapters">按章节数发布</option>
                                        <option value="words">按字数发布</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm text-gray-600 mb-1">定时频率</label>
                                    <select value={form.schedule_type}
                                        onChange={e => setForm({...form, schedule_type: e.target.value})}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                        <option value="daily_once">每天一次</option>
                                        <option value="daily_twice">每天两次</option>
                                        <option value="weekly_weekend">每周六日</option>
                                        <option value="weekly_workday">工作日每天</option>
                                        <option value="weekly_sunday">每周日</option>
                                        <option value="weekly_monday">每周一</option>
                                    </select>
                                </div>
                                {form.schedule_type !== 'daily_twice' && (
                                    <div>
                                        <label className="block text-sm text-gray-600 mb-1">发布时间</label>
                                        <input type="time" value={form.schedule_time}
                                            onChange={e => setForm({...form, schedule_time: e.target.value})}
                                            className="w-full px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                    </div>
                                )}
                                <div className="flex items-end">
                                    <div className="px-3 py-2 bg-blue-50 border border-blue-200 rounded-md text-sm text-blue-700">
                                        <span className="font-medium">执行：</span>
                                        {getScheduleDesc(form.schedule_type, form.schedule_time)}
                                    </div>
                                </div>
                            </div>

                            <div className="mt-4 flex gap-3">
                                <button onClick={handlePreview} disabled={previewing || !form.book_id}
                                    className="px-4 py-2 bg-gray-100 text-gray-700 rounded-md text-sm hover:bg-gray-200 disabled:opacity-50">

                                                        const [minute, hour, , , day_of_week] = parts;

                                                        // 解析小时
                                                        let timeStr = '';
                                                        if (hour === '8,20') {
                                                            timeStr = '每天 8:00 和 20:00';
                                                        } else {
                                                            const hourNum = parseInt(hour);
                                                            const minuteNum = minute === '00' || minute === '0' ? '00' : minute;
                                                            timeStr = `${hourNum.toString().padStart(2, '0')}:${minuteNum.padStart(2, '0')}`;

                                                            // 解析周期
                                                            if (day_of_week === '1-5') {
                                                                return `工作日 ${timeStr}`;
                                                            } else if (day_of_week === '0,6') {
                                                                return `每周六日 ${timeStr}`;
                                                            } else if (day_of_week === '0') {
                                                                return `每周日 ${timeStr}`;
                                                            } else if (day_of_week === '1') {
                                                                return `每周一 ${timeStr}`;
                                                            } else if (day_of_week === '*') {
                                                                return `每天 ${timeStr}`;

                                                            <span className="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs">#{idx + 1}</span>

                                        </div>
                                        <div>

                                            <select value={editingSchedule.publish_mode}
                                                onChange={e => setEditingSchedule({...editingSchedule, publish_mode: e.target.value})}

        function Tasks() {
            const [tasks, setTasks] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [editingId, setEditingId] = React.useState(null);
            const [editTime, setEditTime] = React.useState('');

            const loadTasks = () => {
                setLoading(true);
                fetch(`${API_BASE}/tasks`)
                    .then(r => r.json())
                    .then(data => setTasks(Array.isArray(data) ? data : (data.tasks || [])))
                    .catch(() => setTasks([]))
                    .finally(() => setLoading(false));
            };

            React.useEffect(() => { loadTasks(); }, []);

            const handleEditTime = (task) => {
                setEditingId(task.id);
                const time = task.scheduled_time ? new Date(task.scheduled_time) : new Date();
                setEditTime(time.toISOString().slice(0, 16));
            };

            const handleSaveTime = async (taskId) => {
                const scheduled = new Date(editTime).toISOString();
                await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scheduled_time: scheduled })
                });
                setEditingId(null);
                loadTasks();
                window.showToast('修改成功', 'success');
            };

            const handleDelete = async (taskId) => {
                window.showConfirm('确定删除这个发布任务？', async () => {
                    await fetch(`${API_BASE}/tasks/${taskId}`, { method: 'DELETE' });
                    loadTasks();
                    window.showToast('删除成功', 'success');
                });
            };

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="mb-4">
                        <span className="text-gray-600">共 {tasks.length} 个待发布任务</span>
                    </div>

                    {tasks.length === 0 ? (
                        <div className="text-gray-400 text-center py-8">暂无待发布任务</div>
                    ) : (
                        <div className="space-y-3">
                            {tasks.map(task => (
                                <div key={task.id} className="border border-gray-200 rounded-lg p-4 bg-white">
                                    <div className="flex items-center justify-between">
                                        <div className="flex-1">
                                            <div className="font-medium text-gray-800">
                                                {task.book_name} - {task.chapter_title || `章节${task.chapter_id}`}
                                            </div>
                                            <div className="text-sm text-gray-500 mt-1">
                                                账号: {task.account_name}
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            {editingId === task.id ? (
                                                <>
                                                    <input type="datetime-local" value={editTime}
                                                        onChange={e => setEditTime(e.target.value)}
                                                        className="px-3 py-2 border border-gray-300 rounded-md text-sm" />
                                                    <button onClick={() => handleSaveTime(task.id)}
                                                        className="px-3 py-1 text-xs bg-green-100 text-green-700 rounded hover:bg-green-200">
                                                        保存
                                                    </button>
                                                    <button onClick={() => setEditingId(null)}
                                                        className="px-3 py-1 text-xs bg-gray-100 text-gray-600 rounded hover:bg-gray-200">
                                                        取消
                                                    </button>
                                                </>
                                            ) : (
                                                <>
                                                    <span className="text-sm text-gray-600">
                                                        {task.scheduled_time ? (() => {
                                                            const d = new Date(task.scheduled_time);
                                                            const pad = n => n.toString().padStart(2, '0');
                                                            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                                                        })() : '-'}
                                                    </span>
                                                    <span className={`px-2 py-1 rounded text-xs ${
                                                        task.status === 'pending' ? 'bg-yellow-100 text-yellow-700' :
                                                        task.status === 'publishing' ? 'bg-blue-100 text-blue-700' :
                                                        task.status === 'published' ? 'bg-green-100 text-green-700' :
                                                        'bg-gray-100 text-gray-600'
                                                    }`}>
                                                        {task.status === 'pending' ? '待发布' :
                                                         task.status === 'publishing' ? '发布中' :
                                                         task.status === 'published' ? '已发布' : task.status}
                                                    </span>
                                                    {task.status === 'pending' && (
                                                        <>
                                                            <button onClick={() => handleEditTime(task)}
                                                                className="px-3 py-1 text-xs bg-blue-100 text-blue-700 rounded hover:bg-blue-200">
                                                                修改时间
                                                            </button>
                                                            <button onClick={() => handleDelete(task.id)}
                                                                className="px-3 py-1 text-xs bg-red-100 text-red-700 rounded hover:bg-red-200">
                                                                删除
                                                            </button>
                                                        </>
                                                    )}
                                                </>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function Logs() {
            const [logs, setLogs] = React.useState([]);
            const [loading, setLoading] = React.useState(true);

            React.useEffect(() => {
                fetch(`${API_BASE}/logs?limit=50`)
                    .then(r => r.json())
                    .then(data => setLogs(Array.isArray(data) ? data : (data.logs || [])))
                    .catch(() => setLogs([]))
                    .finally(() => setLoading(false));
            }, []);

            if (loading) return <div className="text-gray-500">加载中...</div>;

            return (
                <div>
                    <div className="flex justify-between items-center mb-4">
                        <span className="text-gray-600">最近 {logs.length} 条日志</span>
                    </div>
                    {logs.length === 0 ? (
                        <div className="text-gray-400 text-center py-8">暂无日志</div>

                        <table className="w-full text-sm">
                            <thead>
                                <tr className="text-left text-gray-500 border-b">

                                    <th className="pb-2">章节</th>
                                    <th className="pb-2">操作</th>
                                    <th className="pb-2">状态</th>
                                    <th className="pb-2">消息</th>
                                </tr>
                            </thead>
                            <tbody>

                                        <td className="py-3">{log.chapter_title}</td>
                                        <td className="py-3">{log.action}</td>
                                        <td className="py-3">
                                            <span className={`px-2 py-1 rounded text-xs ${
                                                log.status === 'success' ? 'bg-green-100 text-green-700' :
                                                log.status === 'failed' ? 'bg-red-100 text-red-700' :
                                                'bg-gray-100 text-gray-600'

                                                {log.status === 'success' ? '成功' : log.status === 'failed' ? '失败' : log.status}
                                            </span>
                                        </td>
                                        <td className="py-3 text-gray-500 text-xs">{log.message || '-'}</td>

                </div>
